<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likelembe Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Roboto', sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status-paid { color: #198754; font-weight: bold; }
        .status-pending { color: #fd7e14; font-weight: bold; }
        .header-bg { background-color: #0d6efd; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="header-bg">
        <div class="container">
            <h1>Likelembe Dashboard</h1>
            <p>Real-time ROSCA Overview</p>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="text-muted">Cycle Status</h5>
                    <h2 id="cycleStatus">Loading...</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="text-muted">Pot Total</h5>
                    <h2 id="potTotal">Loading...</h2>
                </div>
            </div>
             <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="text-muted">Participants</h5>
                    <h2 id="participantCount">Loading...</h2>
                </div>
            </div>
        </div>

        <div class="card p-4 mt-4">
            <h4>Participants List</h4>
            <div class="table-responsive">
                <table class="table table-hover mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="participantsTable">
                        <!-- Rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                // Safety checks
                const cycle = data.cycle || { status: 'N/A', pot_total: 0 };
                const participants = data.participants || [];

                document.getElementById('cycleStatus').innerText = cycle.status ? cycle.status.toUpperCase() : 'N/A';
                document.getElementById('potTotal').innerText = '$' + (cycle.pot_total || 0);
                document.getElementById('participantCount').innerText = participants.length;

                const tbody = document.getElementById('participantsTable');
                tbody.innerHTML = '';
                
                if (participants.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No participants yet.</td></tr>';
                } else {
                    participants.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.name || 'Unknown'}</td>
                            <td>${p.phone_number}</td>
                            <td class="${p.has_paid ? 'status-paid' : 'status-pending'}">
                                ${p.has_paid ? 'PAID' : 'PENDING'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error(e);
                // document.body.innerHTML += '<div class="alert alert-danger text-center">Failed to load data. API might be down.</div>';
            }
        }
        
        loadData();
        // Auto refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
